---
# Dynamic-trace runner: one continuous run whose offered rate AND class mix both
# move over the hour (traces/dynamic/build_dynamic_mix_trace.py).
#
# Differences from runner-exp21.template.yaml (rate-sweep), all deliberate:
#   --mode trace-replay + --trace-file   arrival timing comes from the trace,
#                                        not from a fixed rpm per condition
#   --workload-config mix_dyn60.json     the mix is per-arrival in that same csv
#   --restart-server --restart-per-condition
#                                        trace-replay gates the cold restart on
#                                        --restart-server, and the llumnix path
#                                        additionally requires
#                                        --restart-per-condition; BOTH are needed
#                                        or the run silently reuses a warm fleet
#   no --warmup-rpm                      warmup only exists in rate mode; the
#                                        trace carries its own 60 s lead-in at
#                                        the trough rate (phase=warmup)
#   no --post-duration-grace             the trace driver ignores it and always
#                                        drains in flight work; the k8s job
#                                        timeout is the real backstop
#
# Placeholders: __JOBNAME__ __SESSION__ __TRACE__ __WCFG__ __ARM__
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOBNAME__
  namespace: llumnix
spec:
  backoffLimit: 0
  completions: 1
  template:
    metadata:
      labels:
        app: bench-runner-dyn
    spec:
      serviceAccountName: bench-runner
      restartPolicy: Never
      containers:
        - name: runner
          image: llumnix-registry.cn-beijing.cr.aliyuncs.com/llumnix/vllm:20260306-165123
          workingDir: /work
          env:
            - { name: NVIDIA_VISIBLE_DEVICES, value: "void" }
            - { name: HF_HOME, value: /hf-cache }
            - { name: HF_HUB_OFFLINE, value: "1" }
            - { name: HF_DATASETS_OFFLINE, value: "1" }
            - { name: TRACE, value: "__TRACE__" }
            - { name: WCFG, value: "__WCFG__" }
            - { name: LOAD_PROCS, value: "12" }
            - { name: ARM, value: "__ARM__" }
            - { name: TRANSCRIPT, value: "/work/results/exp10_transcript/transcript_swe_calls_mix1500.jsonl" }
            - { name: RESULT_UID, value: "3092" }
            - { name: RESULT_GID, value: "1999" }
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -uo pipefail
              ln -sf /usr/local/bin/k3s /usr/local/bin/kubectl
              kubectl version --client >/dev/null 2>&1 && echo "[runner] kubectl ok"
              PYBIN=/work/.venv/bin/python
              "$PYBIN" -c "import langchain_openai, pandas, pyarrow, tiktoken" \
                && echo "[runner] venv deps ok" || { echo "[runner] venv missing deps"; exit 1; }
              [ -s "${TRANSCRIPT}" ] || { echo "[runner] transcript missing: ${TRANSCRIPT}"; exit 1; }
              [ -s "${TRACE}" ]      || { echo "[runner] trace missing: ${TRACE}"; exit 1; }
              [ -s "${WCFG}" ]       || { echo "[runner] missing ${WCFG}"; exit 1; }
              # The workload must read the class column of the SAME file the
              # runner replays; a mismatch would pair classes with the wrong
              # arrivals and silently produce a different mix than intended.
              PLANNED=$("$PYBIN" -c "import json,sys;print(json.load(open('${WCFG}'))['class_plan_file'])")
              [ "$PLANNED" = "${TRACE}" ] \
                || { echo "[runner] ABORT: workload class_plan_file=$PLANNED but --trace-file=${TRACE}"; exit 1; }
              echo "[runner] dyn trace run: arm=${ARM} trace=${TRACE}"
              "$PYBIN" -c "import json,os;d=json.load(open(os.environ['TRACE'].rsplit('.csv',1)[0]+'.plan.json'));print('[runner] plan:',d['totals'],'mix',d['mix']['schedule'])"
              "$PYBIN" run_experiment.py \
                --engine llumnix --in-cluster \
                --workload mixed_request_level_poisson \
                --mode trace-replay \
                --trace-file "${TRACE}" \
                --load-procs "${LOAD_PROCS}" \
                --load-threads 2048 \
                --restart-server --restart-per-condition \
                --disable-timeouts \
                --workload-config "${WCFG}" \
                --priority-mode deadline \
                --restart-timeout 1200 \
                --model meta-llama/Meta-Llama-3.1-70B-Instruct \
                --output-dir /work/results \
                --session-name "__SESSION__" \
                --metrics-interval 1.0
              rc=$?
              chown -R "${RESULT_UID}:${RESULT_GID}" /work/results 2>/dev/null || true
              echo "[runner] done rc=$rc"
              exit $rc
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: k3s, mountPath: /usr/local/bin/k3s, readOnly: true }
            - { name: hf-cache, mountPath: /hf-cache }
      volumes:
        - name: work
          hostPath:
            path: /home/nxclab/llumnix_reproduce/Agent_applications/agent_motivation_experiment
            type: Directory
        - name: k3s
          hostPath:
            path: /usr/local/bin/k3s
            type: File
        - name: hf-cache
          hostPath:
            path: /NHNHOME/huggingface
            type: Directory
